name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go test
        run: go test ./... -count=1
      - name: Go race test
        run: go test -race ./... -count=1
      - name: Go vet
        run: go vet ./...

  # Cross-compile distributable binaries for every target, uploaded as
  # workflow artifacts on every push (also a compile check per platform).
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            label: linux-amd64
            name: uno-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            label: linux-arm64
            name: uno-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            label: windows-amd64
            name: uno-windows-amd64.exe
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
            label: macos-intel
            name: uno-darwin-amd64
          - os: ubuntu-latest
            goos: darwin
            goarch: arm64
            label: macos-apple-silicon
            name: uno-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.label }}
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/${{ matrix.name }} ./cmd/uno
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  # On a version tag (v*), collect all built binaries and attach them to a
  # GitHub Release page.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List built binaries
        run: ls -la dist
      - name: Generate checksums
        run: |
          cd dist
          sha256sum uno-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/uno-windows-amd64.exe
            dist/uno-linux-amd64
            dist/uno-linux-arm64
            dist/uno-darwin-amd64
            dist/uno-darwin-arm64
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
